# 一键启动依赖服务（PostgreSQL + Redis）。
# 用法：docker compose up -d
# 然后把 .env 中 DATABASE_URL / REDIS_URL 切到 postgresql/redis（参考 .env.example 注释）
services:
  postgres:
    image: postgres:16-alpine
    container_name: ragent-postgres
    environment:
      POSTGRES_USER: ragent
      POSTGRES_PASSWORD: ragent
      POSTGRES_DB: ragent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragent-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redisdata:
