<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智享电器 · 智能客服</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="chat-page">
  <div class="chat-card">
    <header class="chat-header">
      <span class="logo">🤖</span>
      <div>
        <h1>智享电器 智能客服</h1>
        <div class="sub">意图识别 · 知识检索 · 多轮记忆 · 智能分流</div>
      </div>
      <div class="actions">
        <button class="btn ghost sm" id="new-chat">新会话</button>
      </div>
    </header>

    <div class="chat-tools">
      <span style="font-size:12px;color:#64748b">试试问：</span>
      <button class="btn ghost sm" data-demo="订单怎么退款">订单怎么退款</button>
      <button class="btn ghost sm" data-demo="我的冰箱坏了怎么报修">冰箱坏了怎么报修</button>
      <button class="btn ghost sm" data-demo="发票怎么开">发票怎么开</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <textarea id="input" rows="1" placeholder="请输入您的问题，回车发送，Shift+回车换行"></textarea>
      <button class="btn warn" id="human-btn">转人工</button>
      <button class="btn" id="send">发送</button>
    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
